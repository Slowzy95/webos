<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Espace de Travail</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'>OS</text></svg>" />
  <link rel="stylesheet" href="./utilities.css?v=30">
  <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&family=Jersey+10&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', system-ui, sans-serif;
      overflow: hidden; background: #0b1120; color: #e2e8f0; user-select: none;
    }
    input, textarea, select, .selectable { user-select: text; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.35); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.55); }

    /* ================= FONDS D'ÉCRAN ================= */
    #wallpaper { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(140deg,#0b1120 0%,#101a33 55%,#0b1120 100%); }
    #wallpaper canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #windows-layer { pointer-events: none; }
    #windows-layer > * { pointer-events: auto; }
    .blob { position: absolute; border-radius: 9999px; filter: blur(100px); opacity: .38; pointer-events: none; }
    .blob.b1 { width: 560px; height: 560px; background: #2563eb; top: -180px; left: -120px; animation: drift 26s ease-in-out infinite alternate; }
    .blob.b2 { width: 480px; height: 480px; background: #7c3aed; bottom: -160px; right: -100px; animation: drift 32s ease-in-out infinite alternate-reverse; }
    .blob.b3 { width: 380px; height: 380px; background: #0ea5e9; top: 40%; left: 55%; animation: drift 22s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(90px, 60px) scale(1.15); } }
    .wp-anim-gradient { background-size: 300% 300%; animation: wpGradient 16s ease infinite; }
    @keyframes wpGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .wave { position: absolute; bottom: 0; left: 0; width: 200%; height: 38%; animation: waveMove 11s linear infinite; pointer-events: none; }
    .wave.w2 { height: 26%; opacity: .6; animation-duration: 17s; animation-direction: reverse; }
    @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ================= FENÊTRES ================= */
    .window {
      position: absolute; display: flex; flex-direction: column;
      border-radius: 10px; overflow: hidden;
      background: rgba(20, 27, 45, .84);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 32px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.3);
      animation: winIn .22s cubic-bezier(.2,.9,.3,1.15);
      min-width: 320px; min-height: 220px;
    }
    .window.maximized { border-radius: 0; border: none; }
    @keyframes winIn { from { opacity: 0; transform: scale(.92) translateY(16px); } to { opacity: 1; transform: none; } }
    .win-header { flex: none; height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px 0 13px; background: rgba(255,255,255,.045); border-bottom: 1px solid rgba(255,255,255,.07); cursor: grab; }
    .win-header:active { cursor: grabbing; }
    .win-body { flex: 1; overflow: auto; min-height: 0; }
    .resize-handle { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 5;
      background: linear-gradient(135deg, transparent 50%, rgba(148,163,184,.45) 50%); }
    .window.maximized .resize-handle { display: none; }
    .wbtn { width: 44px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 10.5px; transition: all .1s; }
    .wbtn:hover { background: rgba(255,255,255,.09); color: white; }
    .wbtn.close:hover { background: #c42b1c; color: white; }

    /* Aperçu d'aimantation (fenêtre collée à gauche / droite / haut) */
    #snap-preview { position: fixed; z-index: 9000; border-radius: 10px; background: rgba(56,189,248,.16); border: 1.5px solid rgba(56,189,248,.7); pointer-events: none; transition: all .12s ease; display: none; }

    /* Mode Boost : performances maximales */
    body.boost * { animation: none !important; transition: none !important; }
    body.boost .window { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(15,23,42,.97) !important; box-shadow: 0 8px 24px rgba(0,0,0,.5) !important; }
    body.boost .glass-card, body.boost #tray-popup, body.boost #start-menu { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    body.boost #wallpaper .blob, body.boost #wallpaper .wave { display: none !important; }
    body.boost .win-header, body.boost .btn, body.boost .chip { cursor: auto; }

    /* ================= ICÔNES DU BUREAU (style Fluent) ================= */
    .desk-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; padding: 10px 4px 8px; border-radius: 8px; cursor: pointer; transition: transform .16s cubic-bezier(.2,.9,.3,1.4), background .12s; border: 1px solid transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
    .desk-icon:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.09); transform: translateY(-4px); }
    .desk-icon:active { transform: scale(.93); }
    .desk-icon.selected { background: rgba(96,165,250,.22); border-color: rgba(96,165,250,.7); box-shadow: 0 0 0 1px rgba(96,165,250,.5); }
    .chip-on { background: rgba(96,165,250,.25) !important; color: #bfdbfe !important; border-color: rgba(96,165,250,.6) !important; }
    .ctx-menu { position: fixed; z-index: 99999; background: rgba(15,23,42,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 6px; min-width: 210px; box-shadow: 0 12px 40px rgba(0,0,0,.6); backdrop-filter: blur(12px); }
    .ctx-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; color: #e2e8f0; cursor: pointer; }
    .ctx-item:hover { background: rgba(96,165,250,.18); }
    .ctx-item i { width: 16px; text-align: center; color: #7dd3fc; }
    .desk-icon .ic { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; color: white; position: relative; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
    .desk-icon .ic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%); pointer-events: none; }
    .desk-icon .lbl { font-size: 11.5px; font-weight: 500; color: #f1f5f9; text-shadow: 0 1px 5px rgba(0,0,0,.9); text-align: center; }
    .ic-svg { width: 52px; height: 52px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
    .tb-glyph { width: 26px; height: 26px; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }

    /* ================= BARRE DES TÂCHES (Windows 11) ================= */
    #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; z-index: 9000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(12, 18, 34, .72); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid rgba(255,255,255,.07); }
    #tb-center { display: flex; align-items: center; gap: 4px; }
    #tb-right { position: absolute; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; }
    @media (max-width: 719px) {
      #tb-right .tray-btn:nth-child(1), #tb-right .tray-btn:nth-child(2) { display: none; }
      .tb-icon { width: 42px !important; height: 42px !important; }
    }
    .tb-icon { width: 46px; height: 42px; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; transition: background .12s, transform .12s; position: relative; }
    .tb-icon:hover { background: rgba(255,255,255,.09); }
    .tb-icon:active { transform: scale(.9); }
    .tb-icon .fa-solid, .tb-icon .fa-brands { font-size: 19px; color: #dbe4f0; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    .tb-icon .run-dot { width: 16px; height: 3px; border-radius: 99px; background: #7aa2f7; opacity: 0; transition: all .2s; }
    .tb-icon.open .run-dot { opacity: .55; }
    .tb-icon.active { background: rgba(255,255,255,.1); }
    .tb-icon.active .run-dot { opacity: 1; width: 20px; background: #60a5fa; }
    .win-logo { display: grid; grid-template-columns: 10px 10px; grid-template-rows: 10px 10px; gap: 2.5px; }
    .win-logo span { background: #4cc2ff; border-radius: 1.5px; }
    .tb-sep { width: 1px; height: 26px; background: rgba(255,255,255,.12); margin: 0 5px; }
    .tray-btn { width: 38px; height: 38px; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #cbd5e1; font-size: 15px; transition: background .12s; }
    .tray-btn:hover { background: rgba(255,255,255,.09); color: white; }
    #tb-clock { padding: 0 10px; border-radius: 7px; text-align: right; cursor: pointer; line-height: 1.25; }
    #tb-clock:hover { background: rgba(255,255,255,.08); }

    /* ================= MENU DÉMARRER (Windows 11) ================= */
    #start-menu { position: absolute; left: 50%; transform: translateX(-50%); bottom: 66px; width: 580px; z-index: 9500;
      border-radius: 14px; padding: 20px;
      background: rgba(16, 22, 40, .92); backdrop-filter: blur(34px); -webkit-backdrop-filter: blur(34px);
      border: 1px solid rgba(255,255,255,.10); box-shadow: 0 40px 100px rgba(0,0,0,.75);
      transition: opacity .2s ease, transform .2s cubic-bezier(.2,.9,.3,1.1); }
    #start-menu.hidden-menu { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.98); pointer-events: none; }
    .sm-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 10px; border-radius: 10px; cursor: pointer; transition: background .12s, transform .12s; }
    .sm-tile:hover { background: rgba(255,255,255,.08); transform: translateY(-2px); }
    .sm-tile:active { transform: scale(.94); }
    .sm-tile .ic { width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: white; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.45); }
    .sm-tile .ic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%); }
    .sm-tile .lbl { font-size: 11px; color: #cbd5e1; font-weight: 500; text-align: center; }
    .sm-reco { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .12s; }
    .sm-reco:hover { background: rgba(255,255,255,.08); }
    .sm-reco .ic { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; flex: none; }

    /* ================= MENU CONTEXTUEL / TOASTS ================= */
    #ctx-menu { position: absolute; z-index: 9800; min-width: 230px; border-radius: 10px; padding: 5px;
      background: rgba(16,22,40,.96); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 20px 60px rgba(0,0,0,.6); display: none; }
    .ctx-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 7px; font-size: 12.5px; color: #e2e8f0; cursor: pointer; }
    .ctx-item:hover { background: rgba(255,255,255,.09); }
    .ctx-item.danger:hover { background: rgba(239,68,68,.2); color: #fca5a5; }
    #toasts { position: absolute; right: 14px; bottom: 66px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 500;
      background: rgba(16,22,40,.96); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 12px 40px rgba(0,0,0,.5);
      animation: toastIn .25s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }

    /* ================= COMPOSANTS ================= */
    .glass-card { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; transition: all .15s; }
    .glass-card:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.15); transform: translateY(-2px); }
    .field { width: 100%; background: rgba(2,6,17,.7); border: 1px solid rgba(255,255,255,.13); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: #e2e8f0; outline: none; transition: border-color .15s, box-shadow .15s; }
    .field:focus { border-color: #4cc2ff; box-shadow: 0 0 0 2px rgba(76,194,255,.15); }
    .field::placeholder { color: #64748b; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .13s; border: 1px solid transparent; }
    .btn:active { transform: scale(.96); }
    .btn-blue { background: #2563eb; color: white; } .btn-blue:hover { background: #3b82f6; }
    .btn-green { background: #059669; color: white; } .btn-green:hover { background: #10b981; }
    .btn-red { background: #dc2626; color: white; } .btn-red:hover { background: #ef4444; }
    .btn-violet { background: #7c3aed; color: white; } .btn-violet:hover { background: #8b5cf6; }
    .btn-ghost { background: rgba(255,255,255,.07); color: #cbd5e1; border-color: rgba(255,255,255,.1); } .btn-ghost:hover { background: rgba(255,255,255,.13); color: white; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 11px; font-weight: 500; cursor: pointer;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #cbd5e1; transition: all .13s; white-space: nowrap; }
    .chip:hover { background: rgba(255,255,255,.13); color: white; }
    #yt-results { grid-auto-rows: min-content; }

    /* ================= THÈMES (couleurs d'accent) ================= */
    :root { --accent: #2563eb; --accent-hover: #3b82f6; --accent-light: #4cc2ff; --accent-soft: rgba(37,99,235,.18); --accent-glow: rgba(76,194,255,.15); }

    /* ==== LE THÈME COLORE AUSSI L'INTÉRIEUR DES APPLICATIONS ==== */
    ::selection { background: var(--accent); color: #fff; }
    .win-body { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, rgba(18,24,42,.90)), color-mix(in srgb, var(--accent) 3%, rgba(13,18,33,.94))); }
    .field:focus, .win-body input:focus, .win-body textarea:focus, .win-body select:focus { outline: none; border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn { border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .btn-green { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); }
    .btn-green:hover { background: linear-gradient(135deg, var(--accent-hover), var(--accent)); filter: brightness(1.1); }
    .btn-blue, .btn-violet { background: var(--accent); }
    .btn-blue:hover, .btn-violet:hover { background: var(--accent-hover); }
    .chip.chip-on { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
    .msg-user { background: var(--accent-soft); border-color: var(--accent); }
    .desk-icon.selected { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .wbtn:hover { background: var(--accent-soft); color: #fff; }
    .sm-tile:hover { border-color: var(--accent); }
    .tab.on, .yt-ch.on { border-color: var(--accent); }
    *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 50%, #334155); border-radius: 8px; }
    *::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ==== MODES D'ANIMATION (fenêtres, clics, souris) ==== */
    body[data-anim] .window.win-open { animation: wosOpenWin .24s cubic-bezier(.16,1,.3,1); }
    @keyframes wosOpenWin { from { opacity: 0; transform: scale(.90) translateY(14px); } }
    body[data-anim="linux"] .window.win-open { animation-name: wosOpenLinux; animation-duration: .28s; }
    @keyframes wosOpenLinux { from { opacity: 0; transform: translateY(48px) scale(.97); } }
    body[data-anim="full"] .window.win-open { animation-name: wosOpenFull; animation-duration: .3s; }
    @keyframes wosOpenFull { 0% { opacity: 0; transform: scale(.6) rotate(-3deg); } 60% { transform: scale(1.04) rotate(.5deg); } 100% { opacity: 1; transform: scale(1); } }
    body[data-anim="none"] .window.win-open { animation: none; }
    body[data-anim] .window.win-close { animation: wosClose .16s ease-in forwards; }
    @keyframes wosClose { to { opacity: 0; transform: scale(.92); } }
    body[data-anim="linux"] .window.win-close { animation-name: wosCloseLinux; }
    @keyframes wosCloseLinux { to { opacity: 0; transform: translateY(44px); } }
    body[data-anim="none"] .window.win-close { animation: none; }
    body[data-anim] .window.win-min { animation: wosMin .2s ease-in forwards; }
    @keyframes wosMin { to { opacity: 0; transform: scale(.7) translateY(55%); } }
    body[data-anim="none"] .window.win-min { animation: none; }
    body[data-anim] .window.win-unmin { animation: wosUnmin .24s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes wosUnmin { from { opacity: 0; transform: scale(.7) translateY(50%); } }
    body[data-anim="none"] .window.win-unmin { animation: none; }
    body[data-anim="full"] .tb-icon.launch { animation: wosBounce .5s cubic-bezier(.2,.9,.3,1.4); }
    @keyframes wosBounce { 0% { transform: translateY(0); } 40% { transform: translateY(-7px); } 70% { transform: translateY(-2px); } 100% { transform: translateY(0); } }

    body.theme-red    { --accent: #dc2626; --accent-hover: #ef4444; --accent-light: #f87171; --accent-soft: rgba(220,38,38,.18); --accent-glow: rgba(248,113,113,.15); }
    body.theme-purple { --accent: #7c3aed; --accent-hover: #8b5cf6; --accent-light: #a78bfa; --accent-soft: rgba(124,58,237,.18); --accent-glow: rgba(167,139,250,.15); }
    body.theme-green  { --accent: #059669; --accent-hover: #10b981; --accent-light: #34d399; --accent-soft: rgba(5,150,105,.18); --accent-glow: rgba(52,211,153,.15); }
    body.theme-orange { --accent: #ea580c; --accent-hover: #f97316; --accent-light: #fb923c; --accent-soft: rgba(234,88,12,.18); --accent-glow: rgba(251,146,60,.15); }
    body.theme-pink   { --accent: #db2777; --accent-hover: #ec4899; --accent-light: #f472b6; --accent-soft: rgba(219,39,119,.18); --accent-glow: rgba(244,114,182,.15); }
    body.theme-cyan   { --accent: #0891b2; --accent-hover: #06b6d4; --accent-light: #22d3ee; --accent-soft: rgba(8,145,178,.18); --accent-glow: rgba(34,211,238,.15); }
    body.theme-gold   { --accent: #d97706; --accent-hover: #f59e0b; --accent-light: #fbbf24; --accent-soft: rgba(217,119,6,.18); --accent-glow: rgba(251,191,36,.15); }
    body.theme-mono    { --accent: #e5e7eb; --accent-hover: #f3f4f6; --accent-light: #ffffff; --accent-soft: rgba(229,231,235,.14); --accent-glow: rgba(255,255,255,.12); }
    body.theme-indigo { --accent: #4f46e5; --accent-hover: #6366f1; --accent-light: #818cf8; --accent-soft: rgba(79,70,229,.18); --accent-glow: rgba(129,140,248,.15); }
    body.theme-teal    { --accent: #0d9488; --accent-hover: #14b8a6; --accent-light: #2dd4bf; --accent-soft: rgba(13,148,136,.18); --accent-glow: rgba(45,212,191,.15); }
    body.theme-lime    { --accent: #65a309; --accent-hover: #84cc16; --accent-light: #bef264; --accent-soft: rgba(101,163,9,.18); --accent-glow: rgba(190,242,100,.15); }
    body.theme-crimson { --accent: #be123c; --accent-hover: #e11d48; --accent-light: #fb7185; --accent-soft: rgba(190,18,60,.18); --accent-glow: rgba(251,113,133,.15); }
    body.theme-violet  { --accent: #8b5cf6; --accent-hover: #a78bfa; --accent-light: #c4b5fd; --accent-soft: rgba(139,92,246,.18); --accent-glow: rgba(196,181,253,.15); }
    body.theme-fuchsia { --accent: #d946ef; --accent-hover: #e879f9; --accent-light: #f0abfc; --accent-soft: rgba(217,70,239,.16); --accent-glow: rgba(240,171,252,.15); }

    /* Onglets du navigateur */
    #br-tabs { display: flex; align-items: flex-end; gap: 2px; min-height: 34px; }
    /* Le navigateur prend la couleur du thème (barres, onglets, fond) */
    .br-chrome { background: color-mix(in srgb, var(--accent) 10%, rgba(255,255,255,.02)); }
    #br-frames { background: color-mix(in srgb, var(--accent) 4%, #0b1120); }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px 8px 0 0; font-size: 11px; color: #94a3b8; cursor: pointer; max-width: 160px; min-width: 80px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-bottom: none; transition: all .12s; flex-shrink: 0; }
    .tab:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
    .tab.active { background: color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,.05)); color: #f1f5f9; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-fav { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .tab-close { color: #64748b; font-size: 10px; padding: 2px; border-radius: 4px; flex-shrink: 0; }
    .tab-close:hover { color: #ef4444; background: rgba(239,68,68,.15); }
    .tab-detach:hover { color: #38bdf8; background: rgba(56,189,248,.15); }
    .tab-add { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 12px; flex-shrink: 0; margin-bottom: 2px; }
    .tab-add:hover { background: rgba(255,255,255,.1); color: white; }

    #tray-popup { position: absolute; right: 10px; bottom: 62px; z-index: 9500; background: rgba(15,23,42,.92); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px; min-width: 200px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
    #tray-popup.hidden { display: none; }
    .tray-popup-title { font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .tray-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; color: #e2e8f0; }
    .tray-row i { width: 16px; text-align: center; color: #94a3b8; }

    /* Application des couleurs d'accent */
    .btn-blue { background: var(--accent); color: white; }
    .btn-blue:hover { background: var(--accent-hover); }
    .field:focus { border-color: var(--accent-light); box-shadow: 0 0 0 2px var(--accent-glow); }
    .spinner { border-top-color: var(--accent-light); }
    .window { border: 1px solid rgba(255,255,255,.09); }
    .window.focused { border-color: var(--accent-soft); }
    .tb-icon.active { background: var(--accent-soft); }
    .sm-tile:hover { background: var(--accent-soft); }
    .desk-icon:hover { background: rgba(255,255,255,.08); }

    .win-logo span { background: var(--accent-light); }
    .glass-card:hover { border-color: rgba(255,255,255,.15); }
    .resize-handle { background: var(--accent-light); }
