<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Espace de Travail</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'>OS</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=VT323&family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&family=Jersey+10&family=Segoe+Fluent+Icons&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Segoe UI Variable Display', 'Segoe UI', 'Inter', system-ui, sans-serif;
      overflow: hidden; background: #0b1120; color: #e2e8f0; user-select: none;
    }
    input, textarea, select, .selectable { user-select: text; }
    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148,163,184,.35); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.55); }

    /* ================= FONDS D'ÉCRAN ================= */
    #wallpaper { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(140deg,#0b1120 0%,#101a33 55%,#0b1120 100%); }
    #wallpaper canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    #windows-layer { pointer-events: none; }
    #windows-layer > * { pointer-events: auto; }
    .blob { position: absolute; border-radius: 9999px; filter: blur(100px); opacity: .38; pointer-events: none; }
    .blob.b1 { width: 560px; height: 560px; background: #2563eb; top: -180px; left: -120px; animation: drift 26s ease-in-out infinite alternate; }
    .blob.b2 { width: 480px; height: 480px; background: #7c3aed; bottom: -160px; right: -100px; animation: drift 32s ease-in-out infinite alternate-reverse; }
    .blob.b3 { width: 380px; height: 380px; background: #0ea5e9; top: 40%; left: 55%; animation: drift 22s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(90px, 60px) scale(1.15); } }
    .wp-anim-gradient { background-size: 300% 300%; animation: wpGradient 16s ease infinite; }
    @keyframes wpGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .wave { position: absolute; bottom: 0; left: 0; width: 200%; height: 38%; animation: waveMove 11s linear infinite; pointer-events: none; }
    .wave.w2 { height: 26%; opacity: .6; animation-duration: 17s; animation-direction: reverse; }
    @keyframes waveMove { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ================= FENÊTRES ================= */
    .window {
      position: absolute; display: flex; flex-direction: column;
      border-radius: 10px; overflow: hidden;
      background: rgba(20, 27, 45, .84);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 32px 80px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.3);
      animation: winIn .22s cubic-bezier(.2,.9,.3,1.15);
      min-width: 320px; min-height: 220px;
    }
    .window.maximized { border-radius: 0; border: none; }
    @keyframes winIn { from { opacity: 0; transform: scale(.92) translateY(16px); } to { opacity: 1; transform: none; } }
    .win-header { flex: none; height: 38px; display: flex; align-items: center; justify-content: space-between; padding: 0 5px 0 13px; background: rgba(255,255,255,.045); border-bottom: 1px solid rgba(255,255,255,.07); cursor: grab; }
    .win-header:active { cursor: grabbing; }
    .win-body { flex: 1; overflow: auto; min-height: 0; }
    .resize-handle { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; z-index: 5;
      background: linear-gradient(135deg, transparent 50%, rgba(148,163,184,.45) 50%); }
    .window.maximized .resize-handle { display: none; }
    .wbtn { width: 44px; height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-size: 10.5px; transition: all .1s; }
    .wbtn:hover { background: rgba(255,255,255,.09); color: white; }
    .wbtn.close:hover { background: #c42b1c; color: white; }

    /* Aperçu d'aimantation (fenêtre collée à gauche / droite / haut) */
    #snap-preview { position: fixed; z-index: 9000; border-radius: 10px; background: rgba(56,189,248,.16); border: 1.5px solid rgba(56,189,248,.7); pointer-events: none; transition: all .12s ease; display: none; }

    /* Mode Boost : performances maximales */
    body.boost * { animation: none !important; transition: none !important; }
    body.boost .window { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background: rgba(15,23,42,.97) !important; box-shadow: 0 8px 24px rgba(0,0,0,.5) !important; }
    body.boost .glass-card, body.boost #tray-popup, body.boost #start-menu { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    body.boost #wallpaper .blob, body.boost #wallpaper .wave { display: none !important; }
    body.boost .win-header, body.boost .btn, body.boost .chip { cursor: auto; }

    /* ================= ICÔNES DU BUREAU (style Fluent) ================= */
    .desk-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; padding: 10px 4px 8px; border-radius: 8px; cursor: pointer; transition: transform .16s cubic-bezier(.2,.9,.3,1.4), background .12s; border: 1px solid transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
    .desk-icon:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.09); transform: translateY(-4px); }
    .desk-icon:active { transform: scale(.93); }
    .desk-icon.selected { background: rgba(96,165,250,.22); border-color: rgba(96,165,250,.7); box-shadow: 0 0 0 1px rgba(96,165,250,.5); }
    .chip-on { background: rgba(96,165,250,.25) !important; color: #bfdbfe !important; border-color: rgba(96,165,250,.6) !important; }
    .ctx-menu { position: fixed; z-index: 99999; background: rgba(15,23,42,.97); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 6px; min-width: 210px; box-shadow: 0 12px 40px rgba(0,0,0,.6); backdrop-filter: blur(12px); }
    .ctx-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 6px; font-size: 12.5px; color: #e2e8f0; cursor: pointer; }
    .ctx-item:hover { background: rgba(96,165,250,.18); }
    .ctx-item i { width: 16px; text-align: center; color: #7dd3fc; }
    .desk-icon .ic { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; color: white; position: relative; overflow: hidden; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
    .desk-icon .ic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%); pointer-events: none; }
    .desk-icon .lbl { font-size: 11.5px; font-weight: 500; color: #f1f5f9; text-shadow: 0 1px 5px rgba(0,0,0,.9); text-align: center; }
    .ic-svg { width: 52px; height: 52px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
    .tb-glyph { width: 26px; height: 26px; display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }

    /* ================= BARRE DES TÂCHES (Windows 11) ================= */
    #taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; z-index: 9000;
      display: flex; align-items: center; justify-content: center;
      background: rgba(12, 18, 34, .72); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border-top: 1px solid rgba(255,255,255,.07); }
    #tb-center { display: flex; align-items: center; gap: 4px; }
    #tb-right { position: absolute; right: 10px; top: 0; bottom: 0; display: flex; align-items: center; gap: 2px; }
    @media (max-width: 719px) {
      #tb-right .tray-btn:nth-child(1), #tb-right .tray-btn:nth-child(2) { display: none; }
      .tb-icon { width: 42px !important; height: 42px !important; }
    }
    .tb-icon { width: 46px; height: 42px; border-radius: 7px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; transition: background .12s, transform .12s; position: relative; }
    .tb-icon:hover { background: rgba(255,255,255,.09); }
    .tb-icon:active { transform: scale(.9); }
    .tb-icon .fa-solid, .tb-icon .fa-brands { font-size: 19px; color: #dbe4f0; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    .tb-icon .run-dot { width: 16px; height: 3px; border-radius: 99px; background: #7aa2f7; opacity: 0; transition: all .2s; }
    .tb-icon.open .run-dot { opacity: .55; }
    .tb-icon.active { background: rgba(255,255,255,.1); }
    .tb-icon.active .run-dot { opacity: 1; width: 20px; background: #60a5fa; }
    .win-logo { display: grid; grid-template-columns: 10px 10px; grid-template-rows: 10px 10px; gap: 2.5px; }
    .win-logo span { background: #4cc2ff; border-radius: 1.5px; }
    .tb-sep { width: 1px; height: 26px; background: rgba(255,255,255,.12); margin: 0 5px; }
    .tray-btn { width: 38px; height: 38px; border-radius: 7px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #cbd5e1; font-size: 15px; transition: background .12s; }
    .tray-btn:hover { background: rgba(255,255,255,.09); color: white; }
    #tb-clock { padding: 0 10px; border-radius: 7px; text-align: right; cursor: pointer; line-height: 1.25; }
    #tb-clock:hover { background: rgba(255,255,255,.08); }

    /* ================= MENU DÉMARRER (Windows 11) ================= */
    #start-menu { position: absolute; left: 50%; transform: translateX(-50%); bottom: 66px; width: 580px; z-index: 9500;
      border-radius: 14px; padding: 20px;
      background: rgba(16, 22, 40, .92); backdrop-filter: blur(34px); -webkit-backdrop-filter: blur(34px);
      border: 1px solid rgba(255,255,255,.10); box-shadow: 0 40px 100px rgba(0,0,0,.75);
      transition: opacity .2s ease, transform .2s cubic-bezier(.2,.9,.3,1.1); }
    #start-menu.hidden-menu { opacity: 0; transform: translateX(-50%) translateY(16px) scale(.98); pointer-events: none; }
    .sm-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 10px; border-radius: 10px; cursor: pointer; transition: background .12s, transform .12s; }
    .sm-tile:hover { background: rgba(255,255,255,.08); transform: translateY(-2px); }
    .sm-tile:active { transform: scale(.94); }
    .sm-tile .ic { width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 19px; color: white; position: relative; overflow: hidden; box-shadow: 0 6px 16px rgba(0,0,0,.45); }
    .sm-tile .ic::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.28), transparent 42%); }
    .sm-tile .lbl { font-size: 11px; color: #cbd5e1; font-weight: 500; text-align: center; }
    .sm-reco { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; cursor: pointer; transition: background .12s; }
    .sm-reco:hover { background: rgba(255,255,255,.08); }
    .sm-reco .ic { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: white; flex: none; }

    /* ================= MENU CONTEXTUEL / TOASTS ================= */
    #ctx-menu { position: absolute; z-index: 9800; min-width: 230px; border-radius: 10px; padding: 5px;
      background: rgba(16,22,40,.96); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.1);
      box-shadow: 0 20px 60px rgba(0,0,0,.6); display: none; }
    .ctx-item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 7px; font-size: 12.5px; color: #e2e8f0; cursor: pointer; }
    .ctx-item:hover { background: rgba(255,255,255,.09); }
    .ctx-item.danger:hover { background: rgba(239,68,68,.2); color: #fca5a5; }
    #toasts { position: absolute; right: 14px; bottom: 66px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-radius: 10px; font-size: 12.5px; font-weight: 500;
      background: rgba(16,22,40,.96); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 12px 40px rgba(0,0,0,.5);
      animation: toastIn .25s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }

    /* ================= COMPOSANTS ================= */
    .glass-card { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; transition: all .15s; }
    .glass-card:hover { background: rgba(255,255,255,.09); border-color: rgba(255,255,255,.15); transform: translateY(-2px); }
    .field { width: 100%; background: rgba(2,6,17,.7); border: 1px solid rgba(255,255,255,.13); border-radius: 8px; padding: 9px 12px; font-size: 12.5px; color: #e2e8f0; outline: none; transition: border-color .15s, box-shadow .15s; }
    .field:focus { border-color: #4cc2ff; box-shadow: 0 0 0 2px rgba(76,194,255,.15); }
    .field::placeholder { color: #64748b; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .13s; border: 1px solid transparent; }
    .btn:active { transform: scale(.96); }
    .btn-blue { background: #2563eb; color: white; } .btn-blue:hover { background: #3b82f6; }
    .btn-green { background: #059669; color: white; } .btn-green:hover { background: #10b981; }
    .btn-red { background: #dc2626; color: white; } .btn-red:hover { background: #ef4444; }
    .btn-violet { background: #7c3aed; color: white; } .btn-violet:hover { background: #8b5cf6; }
    .btn-ghost { background: rgba(255,255,255,.07); color: #cbd5e1; border-color: rgba(255,255,255,.1); } .btn-ghost:hover { background: rgba(255,255,255,.13); color: white; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 99px; font-size: 11px; font-weight: 500; cursor: pointer;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #cbd5e1; transition: all .13s; white-space: nowrap; }
    .chip:hover { background: rgba(255,255,255,.13); color: white; }
    #yt-results { grid-auto-rows: min-content; }

    /* ================= THÈMES (couleurs d'accent) ================= */
    :root { --accent: #2563eb; --accent-hover: #3b82f6; --accent-light: #4cc2ff; --accent-soft: rgba(37,99,235,.18); --accent-glow: rgba(76,194,255,.15); }

    /* ==== LE THÈME COLORE AUSSI L'INTÉRIEUR DES APPLICATIONS ==== */
    ::selection { background: var(--accent); color: #fff; }
    .win-body { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 5%, rgba(18,24,42,.90)), color-mix(in srgb, var(--accent) 3%, rgba(13,18,33,.94))); }
    .field:focus, .win-body input:focus, .win-body textarea:focus, .win-body select:focus { outline: none; border-color: var(--accent) !important; box-shadow: 0 0 0 3px var(--accent-soft); }
    .btn { border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .btn-green { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); }
    .btn-green:hover { background: linear-gradient(135deg, var(--accent-hover), var(--accent)); filter: brightness(1.1); }
    .btn-blue, .btn-violet { background: var(--accent); }
    .btn-blue:hover, .btn-violet:hover { background: var(--accent-hover); }
    .chip.chip-on { background: var(--accent-soft); border-color: var(--accent); color: #fff; }
    .msg-user { background: var(--accent-soft); border-color: var(--accent); }
    .desk-icon.selected { background: var(--accent-soft); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .wbtn:hover { background: var(--accent-soft); color: #fff; }
    .sm-tile:hover { border-color: var(--accent); }
    .tab.on, .yt-ch.on { border-color: var(--accent); }
    *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 50%, #334155); border-radius: 8px; }
    *::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ==== MODES D'ANIMATION (fenêtres, clics, souris) ==== */
    body[data-anim] .window.win-open { animation: wosOpenWin .24s cubic-bezier(.16,1,.3,1); }
    @keyframes wosOpenWin { from { opacity: 0; transform: scale(.90) translateY(14px); } }
    body[data-anim="linux"] .window.win-open { animation-name: wosOpenLinux; animation-duration: .28s; }
    @keyframes wosOpenLinux { from { opacity: 0; transform: translateY(48px) scale(.97); } }
    body[data-anim="full"] .window.win-open { animation-name: wosOpenFull; animation-duration: .3s; }
    @keyframes wosOpenFull { 0% { opacity: 0; transform: scale(.6) rotate(-3deg); } 60% { transform: scale(1.04) rotate(.5deg); } 100% { opacity: 1; transform: scale(1); } }
    body[data-anim="none"] .window.win-open { animation: none; }
    body[data-anim] .window.win-close { animation: wosClose .16s ease-in forwards; }
    @keyframes wosClose { to { opacity: 0; transform: scale(.92); } }
    body[data-anim="linux"] .window.win-close { animation-name: wosCloseLinux; }
    @keyframes wosCloseLinux { to { opacity: 0; transform: translateY(44px); } }
    body[data-anim="none"] .window.win-close { animation: none; }
    body[data-anim] .window.win-min { animation: wosMin .2s ease-in forwards; }
    @keyframes wosMin { to { opacity: 0; transform: scale(.7) translateY(55%); } }
    body[data-anim="none"] .window.win-min { animation: none; }
    body[data-anim] .window.win-unmin { animation: wosUnmin .24s cubic-bezier(.2,.9,.3,1.3); }
    @keyframes wosUnmin { from { opacity: 0; transform: scale(.7) translateY(50%); } }
    body[data-anim="none"] .window.win-unmin { animation: none; }
    body[data-anim="full"] .tb-icon.launch { animation: wosBounce .5s cubic-bezier(.2,.9,.3,1.4); }
    @keyframes wosBounce { 0% { transform: translateY(0); } 40% { transform: translateY(-7px); } 70% { transform: translateY(-2px); } 100% { transform: translateY(0); } }

    body.theme-red    { --accent: #dc2626; --accent-hover: #ef4444; --accent-light: #f87171; --accent-soft: rgba(220,38,38,.18); --accent-glow: rgba(248,113,113,.15); }
    body.theme-purple { --accent: #7c3aed; --accent-hover: #8b5cf6; --accent-light: #a78bfa; --accent-soft: rgba(124,58,237,.18); --accent-glow: rgba(167,139,250,.15); }
    body.theme-green  { --accent: #059669; --accent-hover: #10b981; --accent-light: #34d399; --accent-soft: rgba(5,150,105,.18); --accent-glow: rgba(52,211,153,.15); }
    body.theme-orange { --accent: #ea580c; --accent-hover: #f97316; --accent-light: #fb923c; --accent-soft: rgba(234,88,12,.18); --accent-glow: rgba(251,146,60,.15); }
    body.theme-pink   { --accent: #db2777; --accent-hover: #ec4899; --accent-light: #f472b6; --accent-soft: rgba(219,39,119,.18); --accent-glow: rgba(244,114,182,.15); }
    body.theme-cyan   { --accent: #0891b2; --accent-hover: #06b6d4; --accent-light: #22d3ee; --accent-soft: rgba(8,145,178,.18); --accent-glow: rgba(34,211,238,.15); }
    body.theme-gold   { --accent: #d97706; --accent-hover: #f59e0b; --accent-light: #fbbf24; --accent-soft: rgba(217,119,6,.18); --accent-glow: rgba(251,191,36,.15); }
    body.theme-mono    { --accent: #e5e7eb; --accent-hover: #f3f4f6; --accent-light: #ffffff; --accent-soft: rgba(229,231,235,.14); --accent-glow: rgba(255,255,255,.12); }
    body.theme-indigo { --accent: #4f46e5; --accent-hover: #6366f1; --accent-light: #818cf8; --accent-soft: rgba(79,70,229,.18); --accent-glow: rgba(129,140,248,.15); }
    body.theme-teal    { --accent: #0d9488; --accent-hover: #14b8a6; --accent-light: #2dd4bf; --accent-soft: rgba(13,148,136,.18); --accent-glow: rgba(45,212,191,.15); }
    body.theme-lime    { --accent: #65a309; --accent-hover: #84cc16; --accent-light: #bef264; --accent-soft: rgba(101,163,9,.18); --accent-glow: rgba(190,242,100,.15); }
    body.theme-crimson { --accent: #be123c; --accent-hover: #e11d48; --accent-light: #fb7185; --accent-soft: rgba(190,18,60,.18); --accent-glow: rgba(251,113,133,.15); }
    body.theme-violet  { --accent: #8b5cf6; --accent-hover: #a78bfa; --accent-light: #c4b5fd; --accent-soft: rgba(139,92,246,.18); --accent-glow: rgba(196,181,253,.15); }
    body.theme-fuchsia { --accent: #d946ef; --accent-hover: #e879f9; --accent-light: #f0abfc; --accent-soft: rgba(217,70,239,.16); --accent-glow: rgba(240,171,252,.15); }
    body.theme-emeraude { --accent: #10b981; --accent-hover: #34d399; --accent-light: #6ee7b7; --accent-soft: rgba(16,185,129,.16); --accent-glow: rgba(110,231,183,.15); }
    body.theme-ambre   { --accent: #f59e0b; --accent-hover: #fbbf24; --accent-light: #fcd34d; --accent-soft: rgba(245,158,11,.16); --accent-glow: rgba(252,211,77,.15); }

    /* Onglets du navigateur */
    #br-tabs { display: flex; align-items: flex-end; gap: 2px; min-height: 34px; }
    /* Le navigateur prend la couleur du thème (barres, onglets, fond) */
    .br-chrome { background: color-mix(in srgb, var(--accent) 10%, rgba(255,255,255,.02)); }
    #br-frames { background: color-mix(in srgb, var(--accent) 4%, #0b1120); }
    .tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px 8px 0 0; font-size: 11px; color: #94a3b8; cursor: pointer; max-width: 160px; min-width: 80px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); border-bottom: none; transition: all .12s; flex-shrink: 0; }
    .tab:hover { background: rgba(255,255,255,.08); color: #e2e8f0; }
    .tab.active { background: color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,.05)); color: #f1f5f9; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .tab span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab-fav { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .tab-close { color: #64748b; font-size: 10px; padding: 2px; border-radius: 4px; flex-shrink: 0; }
    .tab-close:hover { color: #ef4444; background: rgba(239,68,68,.15); }
    .tab-add { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 6px; color: #94a3b8; cursor: pointer; font-size: 12px; flex-shrink: 0; margin-bottom: 2px; }
    .tab-add:hover { background: rgba(255,255,255,.1); color: white; }

    #tray-popup { position: absolute; right: 10px; bottom: 62px; z-index: 9500; background: rgba(15,23,42,.92); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 14px; min-width: 200px; box-shadow: 0 12px 40px rgba(0,0,0,.6); }
    #tray-popup.hidden { display: none; }
    .tray-popup-title { font-size: 11px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
    .tray-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; color: #e2e8f0; }
    .tray-row i { width: 16px; text-align: center; color: #94a3b8; }

    /* Application des couleurs d'accent */
    .btn-blue { background: var(--accent); color: white; }
    .btn-blue:hover { background: var(--accent-hover); }
    .field:focus { border-color: var(--accent-light); box-shadow: 0 0 0 2px var(--accent-glow); }
    .spinner { border-top-color: var(--accent-light); }
    .window { border: 1px solid rgba(255,255,255,.09); }
    .window.focused { border-color: var(--accent-soft); }
    .tb-icon.active { background: var(--accent-soft); }
    .sm-tile:hover { background: var(--accent-soft); }
    .desk-icon:hover { background: rgba(255,255,255,.08); }
    .chip { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); color: #cbd5e1; }
    .chip:hover { background: var(--accent-soft); color: white; border-color: var(--accent-light); }
    #start-btn:hover { background: var(--accent-soft); }
    .win-logo span { background: var(--accent-light); }
    .glass-card:hover { border-color: rgba(255,255,255,.15); }
    .resize-handle { background: var(--accent-light); }

'use strict';

/* ============================================================
   ÉTAT GLOBAL & PERSISTANCE
============================================================ */
const LS_MEMORY = new Map();
const LS = {
  get: (k, d) => {
    try { const v = localStorage.getItem('webos_' + k); if (v !== null) return v; } catch (e) {}
    return LS_MEMORY.has(k) ? LS_MEMORY.get(k) : d;
  },
  set: (k, v) => {
    LS_MEMORY.set(k, String(v));
    try { localStorage.setItem('webos_' + k, String(v)); } catch (e) {}
  },
  getJSON: (k, d) => { try { return JSON.parse(LS.get(k, null)) ?? d; } catch (e) { return d; } },
  setJSON: (k, v) => LS.set(k, JSON.stringify(v))
};

/* ============================================================
   SAUVETAGE D'IMAGES VIA LE PROXY INTÉGRÉ (v26)
   Les images des domaines bloqués par le réseau (favicons Google,
   miniatures YouTube, images Discord…) sont récupérées par le
   Service Worker du proxy Ultraviolet (même origine) et servies en
   local : elles s'affichent toujours, même sur un réseau filtré.
============================================================ */
let NET_FILTERED = false;
/* Renifleur de réseau : un domaine aléatoire inexistant doit TOUJOURS
   échouer (DNS mort). S'il « répond », c'est que le pare-feu du réseau
   détourne toutes les requêtes (lycée, entreprise) → images et sites
   passent par le proxy en priorité. */
(async () => {
  try {
    const rnd = Math.random().toString(36).slice(2, 12);
    await fetch(`https://${rnd}.inexistant-${Date.now()}.webos-test.invalid/`, { mode: 'no-cors', cache: 'no-store' });
    NET_FILTERED = true; /* le réseau détourne le DNS → filtré */
  } catch (e) { /* échec normal : DNS sain, réseau non filtré */ }
})();

let _rescueWin = null, _rescuePromise = null;
function rescueGateway() {
  /* Mini cadre caché dans la portée du Service Worker du proxy :
     ses requêtes passent par Ultraviolet (même technique que la
     passerelle YouTube). Créé une seule fois. */
  if (!_rescuePromise) {
    _rescuePromise = new Promise((resolve, reject) => {
      const ifr = document.createElement('iframe');
      ifr.style.cssText = 'position:fixed;left:-9999px;width:5px;height:5px;border:0';
      ifr.src = '/proxy/uv/blank.html';
      const to = setTimeout(() => reject(new Error('proxy indisponible')), 15000);
      const onMsg = (ev) => {
        if (ev.data && ev.data.wosYtProxy === 'ready') {
          clearTimeout(to); window.removeEventListener('message', onMsg);
          _rescueWin = ifr.contentWindow; resolve(_rescueWin);
        }
      };
      window.addEventListener('message', onMsg);
      ifr.addEventListener('error', () => { clearTimeout(to); reject(new Error('chargement impossible')); });
      document.body.appendChild(ifr);
    }).catch(e => { _rescuePromise = null; throw e; });
  }
  return _rescuePromise;
}
const _proxyImgCache = new Map();
async function proxyImageURL(url) {
  if (_proxyImgCache.has(url)) return _proxyImgCache.get(url);
  const objURL = await rescueGateway().then(async (cw) => {
    const enc = cw.__uv$config.encodeUrl(url);
    const rep = await cw.fetch('/proxy/uv/service/' + enc);
    if (!rep.ok) throw new Error('HTTP ' + rep.status);
    const blob = await rep.blob();
    return URL.createObjectURL(blob);
  });
  _proxyImgCache.set(url, objURL);
  return objURL;
}

   automatiquement via le proxy (une seule fois par image). */

  proxyImageURL(src).then((u) => {
    t.src = u;
    if (t.style.display === 'none') t.style.display = '';
    t.onerror = null;
  }).catch(() => {});
}, true);

else apiKeys = { ...DEFAULT_KEYS, ...apiKeys }; /* ajoute les nouveaux fournisseurs aux anciennes sauvegardes */

function toast(msg, icon = 'fa-circle-check', color = 'text-emerald-400') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i class="fa-solid ${icon} ${color}"></i><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => { t.style.transition = 'opacity .3s, transform .3s'; t.style.opacity = '0'; t.style.transform = 'translateX(30px)'; }, 2600);
  setTimeout(() => t.remove(), 3000);
}

/* Applique un favicon de façon robuste (plusieurs balises + secours) */
function setFavicon(href) {
  try {
    document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"], link[rel="apple-touch-icon"]').forEach(l => l.remove());
    const add = (rel) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add('icon'); add('shortcut icon'); add('apple-touch-icon');
    const fav = document.getElementById('favicon');
    if (fav) { fav.remove(); } // l'ancienne balise data-URI est remplacée
  } catch (e) {}
}

function applyCloak(title, icon, save = true) {
  if (title) document.title = title;
  if (icon) {
    setFavicon(icon);
    /* Secours : si l'image ne se charge pas (URL morte, http bloqué...), on prend le vrai favicon du domaine */
    const im = new Image();
    im.onerror = () => { try { setFavicon(brandImg(new URL(icon).hostname)); } catch (e) {} };
    im.src = icon;
    if (save) LS.set('cloak_icon', icon);
  }
  if (save) {
    if (title) LS.set('cloak_title', title);
    toast('Camouflage appliqué et sauvegardé', 'fa-mask', 'text-amber-400');
  }
}
(function restoreCloak() {
  const t = LS.get('cloak_title', null), i = LS.get('cloak_icon', null);
  if (t) document.title = t;
  if (i) { setFavicon(i); const im = new Image(); im.onerror = () => { try { setFavicon(brandImg(new URL(i).hostname)); } catch (e) {} }; im.src = i; }
})();

/* ---- Fonds d'écran partagés par la communauté (catégorie « Membres ») ----
   Stockage partagé gratuit sans compte : tout le monde peut publier un fond,
   il apparaît immédiatement pour tous les visiteurs dans la catégorie Membres. */
const SHARED_WALLS_API = 'https://api.restful-api.dev/objects/ff808181a09d98f701a19e29ebde1433';
let MEMBER_WALLS = LS.getJSON('memberwalls', []);
function memberWallsFetch() {
  return fetch(SHARED_WALLS_API).then(r => r.json()).then(o => {
    const walls = (o && o.data && Array.isArray(o.data.walls)) ? o.data.walls : [];
    MEMBER_WALLS = walls.slice(0, 60);
    LS.setJSON('memberwalls', MEMBER_WALLS);
    return MEMBER_WALLS;
  }).catch(() => MEMBER_WALLS);
}
async function memberWallPublish(name, url) {
  /* Vérifie d'abord que l'image existe vraiment (lien mort → erreur claire
     au lieu de publier un fond que personne ne pourra afficher) */
  const alive = await new Promise(res => {
    const im = new Image();
    const to = setTimeout(() => res(false), 10000);
    im.onload = () => { clearTimeout(to); res(true); };
    im.onerror = () => { clearTimeout(to); res(false); };
    im.src = url;
  });
  if (!alive) throw new Error('image introuvable');
  const cur = await memberWallsFetch();
  const list = cur.filter(w => w.url !== url);
  list.unshift({ name: name || 'Fond d\u2019un membre', url, by: 'Membre', ts: Date.now() });
  const trimmed = list.slice(0, 60);
  const rep = await fetch(SHARED_WALLS_API, {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: 'webos-walls', data: { walls: trimmed } })
  });
  if (!rep.ok) throw new Error('publication impossible');
  MEMBER_WALLS = trimmed;
  LS.setJSON('memberwalls', trimmed);
  /* Les images Discord expirent au bout de quelques jours : on prévient */
  if (/cdn\.discordapp\.com|discord\.com\/attachments/.test(url)) {
    try { toast('Attention : les liens Discord expirent vite — ce fond cessera de marcher dans quelques jours', 'fa-triangle-exclamation', 'text-amber-400'); } catch (e) {}
  }
  return trimmed;
}
/* Nettoie la liste partagée : les fonds dont le lien est mort (ex: images
   Discord expirées) sont retirés automatiquement pour tous les membres. */
async function memberWallsClean() {
  const list = await memberWallsFetch();
  if (!list.length) return list;
  const alive = await Promise.all(list.map(w => new Promise(res => {
    const im = new Image();
    const to = setTimeout(() => res(false), 8000);
    im.onload = () => { clearTimeout(to); res(true); };
    im.onerror = () => { clearTimeout(to); res(false); };
    im.src = w.url;
  })));
  const kept = list.filter((_, i) => alive[i]);
  if (kept.length !== list.length) {
    MEMBER_WALLS = kept;
    LS.setJSON('memberwalls', kept);
    try {
      await fetch(SHARED_WALLS_API, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: 'webos-walls', data: { walls: kept } })
      });
    } catch (e) {}
  }
  return kept;
}

const SHARED_CURSORS_API = 'https://api.restful-api.dev/objects/ff808181a09d98f701a1a0d154871bf8';
let MEMBER_CURSORS = LS.getJSON('membercursors', []);
async function memberCursorsFetch() {
  try {
    const rep = await fetch(SHARED_CURSORS_API);
    if (!rep.ok) throw new Error('ko');
    const j = await rep.json();
    const list = (j.data && Array.isArray(j.data.cursors)) ? j.data.cursors : [];
    MEMBER_CURSORS = list;
    LS.setJSON('membercursors', list);
    return list;
  } catch (e) { return LS.getJSON('membercursors', []); }
}
async function memberCursorPublish(name, arrow, pointer) {
  const cur = await memberCursorsFetch();
  const list = cur.filter(c => c.arrow !== arrow);
  list.unshift({ name: name || 'Souris d\u2019un membre', arrow, pointer: pointer || arrow, by: 'Membre', ts: Date.now() });

    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: 'webos-cursors', data: { cursors: trimmed } })
  });

  MEMBER_CURSORS = trimmed;

}

function setCursorTheme(themeId) {
  let st = document.getElementById('cursor-style');
  if (!st) { st = document.createElement('style'); st.id = 'cursor-style'; document.head.appendChild(st); }
  /* Curseur personnalisé par URL (comme les fonds d'écran) */
  if (themeId === 'custom') {
    const c = LS.getJSON('cursor_custom', {});
    const a = (c.a || '').trim(), p = (c.p || '').trim();
    if (a || p) {
      const A = a || p, P = p || a;
      st.textContent = `
        body, .window, .glass-card, .win-header, #taskbar, #desk-icons { cursor: url("${A}") 5 2, auto; }
        a, button, .desk-icon, .chip, .sm-tile, .wbtn, .ctx-item, [data-ytfilter], [data-wall], select, .tab, .yt-ch { cursor: url("${P}") 15 15, pointer; }
        input, textarea { cursor: text; }`;
      LS.set('cursor', 'custom');
      return;
    }
    themeId = 'default'; /* aucune URL enregistrée : curseur classique */
  }
  const t = CURSOR_THEMES[themeId];
  if (!t || themeId === 'default') {
    st.textContent = '';
  } else {
    st.textContent = `
      body, .window, .glass-card, .win-header, #taskbar, #desk-icons { cursor: url("${_curSvg(t.arrow)}") 5 2, auto; }
      a, button, .desk-icon, .chip, .sm-tile, .wbtn, .ctx-item, [data-ytfilter], [data-wall], select, .tab, .yt-ch { cursor: url("${_curSvg(t.pointer)}") 15 15, pointer; }
      input, textarea { cursor: url("${_curSvg(t.text)}") 11 13, text; }`;
  }
  LS.set('cursor', themeId);
}
setCursorTheme(LS.get('cursor', 'default'));

let wallpaperCleanup = null;

/* Sauvegarde locale du fond externe (membres, URL perso) : une copie
   base64 est gardée dans le navigateur — si le lien d'origine meurt
   (images Discord qui expirent, site bloqué…), le fond reste affiché. */
function cacheWallImage(url) {
  LS.set('wall_last_ok', LS.get('wall', 'bloom'));
  if (!/^https:\/\//i.test(url) || url.startsWith(location.origin)) return;
  fetch(url).then(r => r.blob()).then(b => {
    if (b.size > 2200000) return; /* trop lourd pour le stockage local */
    const fr = new FileReader();
    fr.onload = () => LS.setJSON('wall_cache', { url, b64: fr.result });
    fr.readAsDataURL(b);
  }).catch(() => {});
}

function applyWallpaper(w) {
  const wp = document.getElementById('wallpaper');
  if (wallpaperCleanup) { try { wallpaperCleanup(); } catch (e) {} wallpaperCleanup = null; }
  wp.innerHTML = ''; wp.style.cssText = ''; wp.className = '';
  LS.set('wall', w.id);

  if (w.type === 'css') {
    wp.style.background = w.css;
    if (w.anim) wp.classList.add('wp-anim-gradient');
    if (w.blobs) wp.innerHTML = '<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>';
  }
  else if (w.type === 'video') {
    /* Fond d'écran VIDÉO par URL (mp4/webm) : boucle, sans son */
    const v = document.createElement('video');
    v.src = w.url; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;';
    wp.appendChild(v);
    v.play().catch(() => {});
  }
  else if (w.type === 'svg') {
    wp.style.background = '#040b22';
    wp.innerHTML = w.svg;
  }
  else if (w.type === 'image') {
    wp.style.background = `url("${w.url}") center/cover no-repeat`;
    /* Vérifie que l'image existe vraiment (lien Discord expiré, site
       bloqué…) : sinon retour au dernier fond valide ou au fond par
       défaut — plus jamais d'écran « non sauvegardé ». */
    const probe = new Image();
    probe.onload = () => { cacheWallImage(w.url); };
    probe.onerror = () => {
      const cache = LS.getJSON('wall_cache', null);
      if (cache && cache.url === w.url && cache.b64) {
        wp.style.background = `url("${cache.b64}") center/cover no-repeat`;
        return;
      }
      try { toast('Fond d\u2019écran introuvable (lien expiré) — retour au fond précédent', 'fa-triangle-exclamation', 'text-amber-400'); } catch (e) {}
      const prev = LS.get('wall_last_ok', 'bloom');
      setWallpaperById(prev && prev !== w.id ? prev : 'bloom');
    };
    probe.src = w.url;
  }
  else if (w.type === 'waves') {
    wp.style.background = 'linear-gradient(180deg,#020617 0%,#082f49 100%)';
    wp.innerHTML = `
      <svg class="wave" viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="rgba(56,189,248,.16)" d="M0,160 C240,240 480,80 720,160 C960,240 1200,80 1440,160 L1440,320 L0,320 Z"></path></svg>
      <svg class="wave w2" viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="rgba(14,165,233,.22)" d="M0,160 C240,240 480,80 720,160 C960,240 1200,80 1440,160 L1440,320 L0,320 Z"></path></svg>`;
  }
  else if (w.type === 'canvas') {
    const c = document.createElement('canvas');
    wp.appendChild(c);
    const ctx = c.getContext('2d');
    let raf = null;
    const resize = () => { c.width = window.innerWidth; c.height = window.innerHeight; };
    resize();
    window.addEventListener('resize', resize);

    if (w.anim === 'stars') {
      const tint = w.tint || '226,232,240';
      const stars = Array.from({ length: 220 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.6 + .4, p: Math.random() * Math.PI * 2, s: .006 + Math.random() * .012, d: .02 + Math.random() * .06 }));
      const loop = (t) => {
        ctx.fillStyle = w.bg || '#020617'; ctx.fillRect(0, 0, c.width, c.height);
        stars.forEach(st => {
          const a = .3 + .7 * Math.abs(Math.sin(st.p + t * st.s));
          ctx.fillStyle = `rgba(${tint},${a})`;
          ctx.beginPath(); ctx.arc(st.x * c.width, (st.y * c.height + t * st.d) % c.height, st.r, 0, Math.PI * 2); ctx.fill();
        });
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    } else if (w.anim === 'rain') {
      const drops = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, l: 10 + Math.random() * 18, s: 7 + Math.random() * 9 }));
      const loop = () => {
        const g = ctx.createLinearGradient(0, 0, 0, c.height);
        g.addColorStop(0, '#0f172a'); g.addColorStop(1, '#1e3a5f');
        ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
        ctx.strokeStyle = 'rgba(148,197,255,.45)'; ctx.lineWidth = 1.4;
        drops.forEach(d => {
          ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.l); ctx.stroke();
          d.y += d.s; d.x -= .6;
          if (d.y > c.height) { d.y = -20; d.x = Math.random() * c.width; }
        });
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    } else if (w.anim === 'snow') {
      const flakes = Array.from({ length: 130 }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, r: 1.5 + Math.random() * 3.5, s: .4 + Math.random() * 1.2, p: Math.random() * Math.PI * 2 }));
      const loop = (t) => {
        const g = ctx.createLinearGradient(0, 0, 0, c.height);
        g.addColorStop(0, '#1e293b'); g.addColorStop(1, '#475569');
        ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        flakes.forEach(f => {
          ctx.beginPath();
          ctx.arc((f.x + Math.sin(t / 900 + f.p) * 26 + c.width) % c.width, f.y, f.r, 0, Math.PI * 2); ctx.fill();
          f.y += f.s;
          if (f.y > c.height + 6) { f.y = -6; f.x = Math.random() * c.width; }
        });
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    } else if (w.anim === 'matrix') {
      const CH = 'アイウエオカキクケコサシスセソ01'; const FS = 15;
      let cols = Math.ceil(c.width / FS); let drops = Array.from({ length: cols }, () => Math.random() * -60);
      const loop = () => {
        ctx.fillStyle = 'rgba(2,10,4,.09)'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#22c55e'; ctx.font = FS + 'px monospace';
        cols = Math.ceil(c.width / FS);
        if (drops.length !== cols) drops = Array.from({ length: cols }, () => Math.random() * -60);
        drops.forEach((y, i) => {
          ctx.fillText(CH[~~(Math.random() * CH.length)], i * FS, y * FS);
          drops[i] = y * FS > c.height && Math.random() > .975 ? 0 : y + 1;
        });
        raf = requestAnimationFrame(loop);
      };
      raf = requestAnimationFrame(loop);
    }
    wallpaperCleanup = () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }
}

function setWallpaperById(id) {
  /* Fonds partagé par un membre : id = « member:<url> » */
  if (typeof id === 'string' && id.startsWith('member:')) {
    applyWallpaper({ id, type: 'image', url: id.slice(7) });
    return;
  }
  const w = WALLPAPERS.find(x => x.id === id) || WALLPAPERS[0];
  applyWallpaper(w);
}
function randomWallpaper() {
  const w = WALLPAPERS[~~(Math.random() * WALLPAPERS.length)];
  applyWallpaper(w);
  toast('Fond d\u2019écran : ' + w.name, 'fa-image', 'text-pink-400');
}

/* ================= WI-FI : VRAI état réseau, mis à jour EN DIRECT =================
   L'icône reflète la connexion réelle : verte quand c'est connecté, rouge quand
   c'est coupé, et le popup se rafraîchit tout seul (débit, ping, type de réseau). */
const wifiBtn = document.querySelector('.tray-btn[title="Réseau sans fil"]');
const wifiIcon = wifiBtn.querySelector('i');
function wifiState() {
  const online = navigator.onLine;
  const conn = navigator.connection || {};
  return {
    online,
    type: conn.effectiveType ? conn.effectiveType.toUpperCase() : (online ? 'Wi-Fi' : '—'),
    down: conn.downlink ? Math.round(conn.downlink) : null,
    rtt: conn.rtt != null ? conn.rtt : null
  };
}
function wifiPopupHtml() {
  const s = wifiState();
  return `
    <div class="tray-popup-title"><i class="fa-solid fa-wifi mr-1.5 text-sky-400"></i>Réseau</div>
    <div class="tray-row"><i class="fa-solid fa-circle text-[7px] ${s.online ? 'text-emerald-400' : 'text-red-400'}"></i>${s.online ? 'Connecté' : 'Hors ligne'}</div>
    <div class="tray-row"><i class="fa-solid fa-signal"></i>Type : ${s.type}</div>
    <div class="tray-row"><i class="fa-solid fa-download"></i>Débit : ${s.down != null ? s.down + ' Mb/s' : '—'}</div>
    <div class="tray-row"><i class="fa-solid fa-stopwatch"></i>Ping : ${s.rtt != null ? s.rtt + ' ms' : '—'}</div>
    <div class="tray-row"><i class="fa-solid fa-shield-halved"></i>Statut : ${s.online ? 'Sécurisé' : 'Aucune connexion'}</div>`;
}
function refreshWifiUI() {
  const s = wifiState();
  wifiIcon.className = 'fa-solid fa-wifi text-[13px]' + (s.online ? '' : ' text-red-400');
  wifiBtn.title = s.online ? 'Réseau sans fil — connecté (' + s.type + ')' : 'Réseau sans fil — hors ligne';
  refreshLiveTray();
}
/* le popup ouvert se met à jour tout seul quand l'état réseau change */
function refreshLiveTray() {
  if (trayPopup.classList.contains('hidden') || !trayPopup.dataset.live) return;
  if (trayPopup.dataset.live === 'wifi') trayPopup.innerHTML = wifiPopupHtml();
  else if (trayPopup.dataset.live === 'battery') trayPopup.innerHTML = batPopupHtml();
}

/* ================= BATTERIE : vrai niveau + icône en direct =================
   L'icône de la barre des tâches montre le VRAI niveau (pleine, 3/4, moitié,
   quart, vide, éclair si en charge) et se met à jour toute seule. */
const batBtn = document.querySelector('.tray-btn[title="Batterie"]');
const batIcon = batBtn.querySelector('i');
let batInfo = null; /* { level, charging } */
async function refreshBattery() {
  try {
    const bat = await navigator.getBattery();
    batInfo = { level: Math.round(bat.level * 100), charging: !!bat.charging };
  } catch (e) { batInfo = null; }
  if (batInfo) {
    const l = batInfo.level;
    const shape = batInfo.charging ? 'fa-bolt' : l > 87 ? 'fa-battery-full' : l > 62 ? 'fa-battery-three-quarters' : l > 37 ? 'fa-battery-half' : l > 12 ? 'fa-battery-quarter' : 'fa-battery-empty';
    batIcon.className = 'fa-solid ' + shape + ' text-[13px]' + (batInfo.charging ? ' text-amber-400' : (!batInfo.charging && l <= 20 ? ' text-red-400' : ''));
    batBtn.title = 'Batterie : ' + l + '%' + (batInfo.charging ? ' (en charge)' : '');
  } else {
    batIcon.className = 'fa-solid fa-battery-three-quarters text-[13px]';
    batBtn.title = 'Batterie';
  }
  refreshLiveTray();
}
function batPopupHtml() {
  const level = batInfo ? batInfo.level : null, charging = batInfo ? batInfo.charging : false;
  return `
    <div class="tray-popup-title"><i class="fa-solid fa-battery-three-quarters mr-1.5 text-emerald-400"></i>Batterie</div>
    <div class="tray-row"><i class="fa-solid ${charging ? 'fa-bolt text-amber-400' : 'fa-battery-full'}"></i>${level !== null ? level + '%' : 'N/D'}${charging ? ' (en charge)' : ''}</div>
    ${level !== null ? `<div style="height:8px;background:rgba(255,255,255,.1);border-radius:4px;margin:8px 0;overflow:hidden"><div style="height:100%;width:${level}%;background:${level > 20 ? '#10b981' : '#ef4444'};border-radius:4px;transition:width .3s"></div></div>` : ''}
    <div class="tray-row text-[11px] text-slate-400">${level !== null ? (charging ? 'Branché et en charge' : level > 20 ? 'Bonne autonomie' : 'Batterie faible') : 'Infos non disponibles sur cet appareil'}</div>`;
}
setInterval(refreshBattery, 30000);
refreshBattery();

document.getElementById('tb-clock').addEventListener('click', () => {
  trayPopup.dataset.live = '';
  const now = new Date();
  const days = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const offset = (firstDay === 0 ? 6 : firstDay - 1);
  let cal = '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;text-align:center;margin-top:8px">';
  ['L','M','M','J','V','S','D'].forEach(d => cal += `<div style="color:#64748b;font-weight:600;padding:2px 0">${d}</div>`);
  for (let i = 0; i < offset; i++) cal += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === now.getDate();
    cal += `<div style="padding:3px 0;border-radius:5px;${isToday ? 'background:var(--accent);color:white;font-weight:700' : 'color:#cbd5e1'}">${d}</div>`;
  }
  cal += '</div>';
  trayPopup.innerHTML = `
    <div class="tray-popup-title"><i class="fa-regular fa-calendar mr-1.5 text-sky-400"></i>${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}</div>
    <div id="tray-live-clock" style="font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:4px">${now.toLocaleTimeString('fr-FR')}</div>
    ${cal}`;
  trayPopup.classList.remove('hidden');
  /* Horloge en temps réel : les secondes tournent tant que le calendrier est ouvert */
  if (window._trayTick) clearInterval(window._trayTick);
  window._trayTick = setInterval(() => {
    const el = document.getElementById('tray-live-clock');
    if (!el || trayPopup.classList.contains('hidden')) { clearInterval(window._trayTick); window._trayTick = null; return; }
    el.textContent = new Date().toLocaleTimeString('fr-FR');
  }, 1000);
});

/* ============================================================
   SKINS SYSTÈME : change tout le look d'un coup (barre, fenêtres,
   fond d'écran, couleurs, police) — Windows 10/7/XP/98, Ubuntu, macOS.
============================================================ */
const OS_SKINS = {
  win11:   { name: 'Windows 11', icon: 'fab fa-windows', wall: 'bloom', theme: 'blue', font: 'normal', cls: '' },
  win10:   { name: 'Windows 10', icon: 'fab fa-windows', wall: 'os-win10', theme: 'blue', font: 'normal', cls: 'skin-win10' },
  win7:    { name: 'Windows 7', icon: 'fab fa-windows', wall: 'os-win7', theme: 'cyan', font: 'normal', cls: 'skin-win7' },
  winxp:   { name: 'Windows XP', icon: 'fab fa-windows', wall: 'os-winxp', theme: 'green', font: 'normal', cls: 'skin-winxp' },
  win98:   { name: 'Windows 98', icon: 'fab fa-windows', wall: 'os-win98', theme: 'blue', font: 'vt323', cls: 'skin-win98' },
  ubuntu:  { name: 'Ubuntu Linux', icon: 'fab fa-ubuntu', wall: 'os-ubuntu', theme: 'orange', font: 'normal', cls: 'skin-ubuntu' },
  macos:   { name: 'macOS', icon: 'fab fa-apple', wall: 'os-macos', theme: 'cyan', font: 'normal', cls: 'skin-macos' }
};
function applySkin(id, restore = false) {
  const s = OS_SKINS[id];
  if (!s) return;
  /* retire l'ancien skin, les classes de thème et de police */
  document.body.className = document.body.className.replace(/skin-\S+/g, '').replace(/theme-\w+/g, '').trim();
  document.body.classList.remove('mc', 'font-vt323', 'font-silkscreen', 'font-pixelify', 'font-jersey');
  if (s.cls) document.body.classList.add(s.cls);
  if (restore) {
    /* AU DÉMARRAGE : le skin ne touche PLUS au thème, à la police ni au style
       Minecraft choisis par l'utilisateur — ils sont restaurés tels quels et
       ne sont plus jamais écrasés (bug de sauvegarde corrigé). */
    const savedTheme = LS.get('theme', 'blue');
    if (savedTheme !== 'blue') document.body.classList.add('theme-' + savedTheme);
    const savedFont = LS.get('font', 'normal');
    if (savedFont !== 'normal') { const f = { mc: 'mc', vt323: 'font-vt323', silkscreen: 'font-silkscreen', pixelify: 'font-pixelify', jersey: 'font-jersey' }[savedFont]; if (f) document.body.classList.add(f); }
  } else {
    /* changement manuel de skin : le skin impose son ambiance (et le note) */
    if (s.theme !== 'blue') document.body.classList.add('theme-' + s.theme);
    if (s.font !== 'normal') { const f = { mc: 'mc', vt323: 'font-vt323', silkscreen: 'font-silkscreen', pixelify: 'font-pixelify', jersey: 'font-jersey' }[s.font]; if (f) document.body.classList.add(f); }
    LS.set('theme', s.theme);
    LS.set('font', s.font);
    LS.set('mcstyle', s.font === 'mc' ? '1' : '0');
    setWallpaperById(s.wall);
    LS.set('skin', id);
    toast('Apparence « ' + s.name + ' » appliquée', 'fa-wand-magic-sparkles', 'text-violet-400');
  }
  /* les onglets de la barre des tâches et les logos d'apps s'adaptent au skin */
  try { renderTaskbar(); refreshSkinIcons(); } catch (e) {}
}
/* restaure le skin sauvegardé au démarrage (sans écraser le fond choisi) */
