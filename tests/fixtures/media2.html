<!doctype html><meta charset="utf-8"><body><h3 id="t">media2</h3>
<audio id="a" loop controls></audio><video id="v" loop></video>

<script>
function wav(){const n=8000,b=new ArrayBuffer(44+n*2),d=new DataView(b);const w=(o,s)=>{for(let i=0;i<s.length;i++)d.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');d.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,16000,true);d.setUint16(32,2,true);d.setUint16(34,16,true);w(36,'data');d.setUint32(40,n*2,true);for(let i=0;i<n;i++)d.setInt16(44+i*2,Math.sin(i/10)*8000,true);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
document.getElementById('a').src=wav();
setTimeout(()=>{const AC=window.AudioContext;window.ctx=new AC();const o=ctx.createOscillator();o.connect(ctx.destination);o.start();},800);
document.getElementById('a').play().catch(()=>{});
</script>
